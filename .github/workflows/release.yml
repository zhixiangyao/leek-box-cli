name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out tag
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: |
          pnpm fmt:check
          pnpm lint:check
          pnpm typecheck
          pnpm test

      - name: Build standalone executable
        run: pnpm bundle

      - name: Smoke test executable
        run: ./dist/leek-box-cli --version

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail

          asset_tag="${GITHUB_REF_NAME//\//-}"
          archive="leek-box-cli-${asset_tag}-linux-x64.tar.gz"
          script="leek-box-cli-${asset_tag}.mjs"

          mkdir -p release
          tar -C dist -czf "release/${archive}" leek-box-cli
          cp dist/cli.mjs "release/${script}"
          (
            cd release
            sha256sum "${archive}" "${script}" > SHA256SUMS
          )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
