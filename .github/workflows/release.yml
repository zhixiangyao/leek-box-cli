name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Required so `npm publish --provenance` can request a short-lived OIDC token
  # and attach a signed provenance statement to the published package.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, release, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out tag
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail

          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"

          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg_version}. Bump the version and retag."
            exit 1
          fi
          echo "Releasing leek-box-cli@${pkg_version}"

      - name: Run quality checks
        run: |
          pnpm fmt:check
          pnpm lint:check
          pnpm typecheck
          pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke test build
        run: node dist/cli.mjs --version

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail

          asset_tag="${GITHUB_REF_NAME//\//-}"
          script="leek-box-cli-${asset_tag}.mjs"

          mkdir -p release
          cp dist/cli.mjs "release/${script}"
          (
            cd release
            sha256sum "${script}" > SHA256SUMS
          )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi

      - name: Check for npm token
        id: npm_token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN secret is not set; skipping npm publish. Add it under Settings → Secrets and variables → Actions to enable publishing."
          fi

      # A second setup-node writes an .npmrc with the registry + auth mapping only
      # for the publish steps, keeping the earlier `pnpm install` free of any auth
      # config. The publish itself uses `npm` (pnpm 10 delegates publishing to the
      # npm CLI anyway), which avoids pnpm's stricter .npmrc env-expansion rules.
      - name: Set up Node.js for the npm registry
        if: steps.npm_token.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
          registry-url: 'https://registry.npmjs.org'
          always-auth: true

      - name: Publish to npm
        if: steps.npm_token.outputs.present == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          published="$(npm view "leek-box-cli@${version}" version 2>/dev/null || true)"

          if [ -n "$published" ]; then
            echo "leek-box-cli@${version} is already published; skipping."
          else
            npm publish --provenance --access public
            echo "Published leek-box-cli@${version} to npm."
          fi
